<!DOCTYPE html>
<html lang="en">
<head>
    <!-- GUIDE
    Basically, you need an answers.json file exported from exam_simple.html. Once you have it, put it in this grader.
    1. L-click for +1 mark
    2. R-click for -1 mark
    3. Hover + press A to toggle question attempted or not
    4. And middle click to mark question as unfair. 
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Exam Grader | Reactive Matte Black</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1320;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            color: #f1f5f9;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.07), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.05), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.06), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.05), transparent),
                radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.08), transparent),
                radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.07), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .grader-container {
            max-width: 1400px;
            margin: 0 auto;
            background: linear-gradient(145deg, #141c2c, #101724);
            border-radius: 1.5rem;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .grader-container:hover {
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.09);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
        }

        .header-row::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,0.25), rgba(139,92,246,0.25), transparent);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 small {
            font-size: 0.7rem;
            background: rgba(51,65,85,0.8);
            color: #cbd5e1;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            -webkit-text-fill-color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            letter-spacing: 0.5px;
        }

        .total-mark-area {
            background: rgba(30,41,59,0.8);
            border-radius: 60px;
            padding: 0.4rem 1.8rem 0.4rem 1.5rem;
            color: #f1f5f9;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            transition: background 0.4s ease, border-color 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .total-mark-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59,130,246,0.06), rgba(139,92,246,0.06));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .total-mark-area:hover::before {
            opacity: 1;
        }

        .total-mark-area span:first-child {
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .total-mark-number {
            font-size: 2rem;
            font-weight: 800;
            padding: 0 0.8rem;
            border-radius: 48px;
            line-height: 1.3;
            transition: background 0.6s ease, box-shadow 0.6s ease;
            min-width: 80px;
            text-align: center;
            background: #fbbf24;
            color: #0f172a;
            position: relative;
            z-index: 1;
        }

        .total-mark-number.positive {
            background: #10b981;
            color: #0f172a;
            box-shadow: 0 0 30px rgba(16,185,129,0.3);
        }

        .total-mark-number.zero {
            background: #fbbf24;
            color: #0f172a;
            box-shadow: 0 0 30px rgba(251,191,36,0.25);
        }

        .total-mark-number.negative {
            background: #ef4444;
            color: #0f172a;
            box-shadow: 0 0 30px rgba(239,68,68,0.3);
        }

        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin: 1.2rem 0 1.5rem 0;
            gap: 1rem;
        }

        .stats-panel {
            display: flex;
            gap: 1.5rem;
            background: rgba(30,41,59,0.6);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 500;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .stat-card {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.85rem;
            padding: 0.2rem 0;
            position: relative;
        }

        .stat-card:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.06);
        }

        .stat-label {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.15rem;
            background: rgba(51,65,85,0.6);
            padding: 0 0.6rem;
            border-radius: 32px;
            min-width: 40px;
            display: inline-block;
            text-align: center;
            color: #f1f5f9;
            transition: background 0.3s ease, color 0.3s ease;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .stat-value.pop {
            animation: statPop 0.3s ease;
        }

        @keyframes statPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); color: #60a5fa; }
            100% { transform: scale(1); }
        }

        .file-upload-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .file-label {
            background: rgba(51,65,85,0.6);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
            color: #e2e8f0;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .file-label i {
            font-size: 0.9rem;
            color: #60a5fa;
            transition: transform 0.3s ease;
        }

        .file-label:hover {
            background: rgba(59,130,246,0.2);
            border-color: rgba(59,130,246,0.3);
            box-shadow: 0 8px 25px rgba(59,130,246,0.1);
        }

        .file-label:hover i {
            transform: scale(1.1);
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.3px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reset-btn {
            background: rgba(51,65,85,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.8rem;
            color: #cbd5e1;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .reset-btn i {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .reset-btn:hover {
            background: rgba(239,68,68,0.2);
            border-color: rgba(239,68,68,0.3);
            color: #fca5a5;
            box-shadow: 0 8px 25px rgba(239,68,68,0.05);
        }

        .reset-btn:hover i {
            transform: rotate(-180deg);
        }

        .timer-banner {
            background: rgba(154,52,18,0.3);
            border-left: 3px solid #f97316;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            margin: 0 0 1.2rem 0;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fed7aa;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249,115,22,0.1);
            border-left-width: 3px;
            animation: fadeSlideDown 0.5s ease;
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer-banner i {
            color: #f97316;
            font-size: 1rem;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0 1.5rem;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-card {
            background: rgba(30,41,59,0.6);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .q-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59,130,246,0), rgba(139,92,246,0));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 1rem;
            pointer-events: none;
        }

        .q-card:hover {
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.6);
            border-color: rgba(59,130,246,0.25);
            background: rgba(30,41,59,0.8);
        }

        .q-card:hover::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(59,130,246,0.06), rgba(139,92,246,0.06));
        }

        .q-card.unfair-highlight {
            background: rgba(80,40,60,0.6);
            border-color: rgba(244,114,182,0.5);
            box-shadow: 0 0 30px rgba(244,114,182,0.15), inset 0 0 30px rgba(244,114,182,0.05);
        }

        .q-card.unfair-highlight::before {
            background: linear-gradient(135deg, rgba(244,114,182,0.1), rgba(236,72,153,0.1));
            opacity: 1;
        }

        .q-header {
            background: rgba(15,23,42,0.6);
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .q-num {
            background: rgba(51,65,85,0.5);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .q-num.unattempted {
            color: #fca5a5;
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.1);
        }

        .q-body {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .q-card:focus {
            outline: none;
        }
        .q-card:focus-visible {
            outline: none;
        }

        .answer-preview {
            font-size: 0.7rem;
            background: rgba(15,23,42,0.6);
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            text-align: center;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-word;
            border: 1px solid rgba(255,255,255,0.04);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .q-card.unfair-highlight .answer-preview {
            background: rgba(80,40,60,0.4);
            color: #fbcfe8;
            border-color: rgba(244,114,182,0.15);
        }

        .mark-display {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            padding: 0.4rem;
            border-radius: 28px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 0.5px;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .mark-display::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.04), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .mark-display:hover::after {
            opacity: 1;
        }

        .mark-positive {
            background: rgba(16,185,129,0.2);
            color: #6ee7b7;
            border-color: rgba(16,185,129,0.25);
        }

        .mark-positive:hover {
            background: rgba(16,185,129,0.3);
            border-color: rgba(16,185,129,0.4);
            box-shadow: 0 0 30px rgba(16,185,129,0.15);
        }

        .mark-zero {
            background: rgb(28,37,52);
            color: #cbd5e1;
            border-color: rgba(255,255,255,0.06);
        }

        .mark-zero:hover {
            background: rgb(38,48,66);   /* slightly lighter for hover feedback */
            border-color: rgba(255,255,255,0.1);
        }

        .mark-negative {
            background: rgba(239,68,68,0.2);
            color: #fca5a5;
            border-color: rgba(239,68,68,0.25);
        }

        .mark-negative:hover {
            background: rgba(239,68,68,0.3);
            border-color: rgba(239,68,68,0.4);
            box-shadow: 0 0 30px rgba(239,68,68,0.15);
        }

        .q-card.unfair-highlight .mark-display,
        .q-card.unfair-highlight .mark-positive,
        .q-card.unfair-highlight .mark-zero,
        .q-card.unfair-highlight .mark-negative {
            background: rgba(244,114,182,0.25);
            color: #fbcfe8;
            border-color: rgba(244,114,182,0.5);
            box-shadow: 0 0 20px rgba(244,114,182,0.15);
        }

        .q-card.unfair-highlight .mark-display:hover,
        .q-card.unfair-highlight .mark-positive:hover,
        .q-card.unfair-highlight .mark-zero:hover,
        .q-card.unfair-highlight .mark-negative:hover {
            background: rgba(244,114,182,0.35);
            border-color: rgba(244,114,182,0.7);
            box-shadow: 0 0 30px rgba(244,114,182,0.25);
        }


        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .footer-bar span {
            font-size: 0.65rem;
            color: #64748b;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-bar span i {
            font-size: 0.75rem;
            opacity: 0.5;
        }

        .footer-bar .interaction-hint {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .footer-bar .interaction-hint span {
            transition: color 0.3s ease;
        }

        .footer-bar .interaction-hint span:hover {
            color: #cbd5e1;
        }

        .error-msg {
            background: rgba(80,40,40,0.4);
            border-left: 3px solid #ef4444;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin: 1rem 0;
            font-size: 0.85rem;
            color: #fecaca;
            border: 1px solid rgba(239,68,68,0.1);
            border-left-width: 3px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .error-msg i {
            color: #ef4444;
            font-size: 1rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            gap: 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #334155;
            opacity: 0.5;
        }

        .empty-state p {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .empty-state .highlight-text {
            color: #60a5fa;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(59,130,246,0.2);
        }

        .empty-state .highlight-text:hover {
            background: rgba(59,130,246,0.1);
            border-color: rgba(59,130,246,0.3);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .grader-container { padding: 1rem; }
            .questions-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.7rem; }
            .stats-panel { gap: 0.8rem; padding: 0.4rem 1rem; }
            .stats-panel .stat-card:not(:last-child)::after { display: none; }
            .total-mark-number { font-size: 1.5rem; min-width: 60px; }
            .header-row { flex-direction: column; align-items: stretch; }
            .subhead { flex-direction: column; align-items: stretch; }
            .file-upload-area { flex-wrap: wrap; }
            .footer-bar { flex-direction: column; align-items: stretch; text-align: center; }
            .footer-bar .interaction-hint { justify-content: center; }
        }

        @media (max-width: 480px) {
            .questions-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .q-body { padding: 0.5rem; }
            .mark-display { font-size: 0.9rem; padding: 0.3rem; }
            .answer-preview { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

<div class="grader-container">
    <div class="header-row">
        <h1>
            <i class="fas fa-graduation-cap" style="font-size:1.4rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
            Exam Grader
            <small>per-question marks</small>
        </h1>
        <div class="total-mark-area">
            <span><i class="fas fa-star" style="font-size:0.7rem; opacity:0.5;"></i> TOTAL</span>
            <span class="total-mark-number zero" id="grandTotal">0.00</span>
        </div>
    </div>

    <div class="subhead">
        <div class="stats-panel" id="statsPanel">
            <div class="stat-card">
                <span class="stat-label"><i class="fas fa-check-circle" style="font-size:0.7rem; color:#34d399;"></i> Attempted</span>
                <span id="attemptedCount" class="stat-value">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><i class="fas fa-circle" style="font-size:0.7rem; color:#f87171;"></i> Unattempted</span>
                <span id="unattemptedCount" class="stat-value">-</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><i class="fas fa-list" style="font-size:0.7rem; color:#60a5fa;"></i> Questions</span>
                <span id="totalQDisplay" class="stat-value">-</span>
            </div>
        </div>
        <div class="file-upload-area">
            <label class="file-label" for="answersFileInput">
                <i class="fas fa-upload"></i> Load answers.json
            </label>
            <input type="file" id="answersFileInput" accept=".json">
            <span class="file-name" id="fileNameDisplay">
                <i class="fas fa-file" style="font-size:0.7rem; opacity:0.3;"></i> No file loaded
            </span>
            <button class="reset-btn" id="resetAllMarksBtn">
                <i class="fas fa-undo-alt"></i> Reset marks
            </button>
        </div>
    </div>

    <div id="timerBannerContainer"></div>

    <div id="dynamicGridContainer" class="questions-grid">
        <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>No exam data loaded.</p>
            <span class="highlight-text" onclick="document.getElementById('answersFileInput').click()">
                <i class="fas fa-upload" style="font-size:0.8rem;"></i> Load answers.json to begin
            </span>
        </div>
    </div>

    <div class="footer-bar">
        <div class="interaction-hint">
            <span><i class="fas fa-mouse-pointer"></i> Left click: <strong style="color:#6ee7b7;">+1</strong> mark</span>
            <span><i class="fas fa-mouse-pointer" style="transform:rotate(180deg);"></i> Right click: <strong style="color:#fca5a5;">-1</strong> mark</span>
            <span><i class="fas fa-mouse"></i> Middle click: <strong style="color:#f472b6;">unfair</strong> highlight</span>
            <span><i class="fas fa-keyboard"></i> Hover + <strong style="color:#fbbf24;">A</strong>: toggle attempted</span>
        </div>
        <span><i class="fas fa-circle" style="color:#34d399; font-size:0.5rem;"></i> positive · <i class="fas fa-circle" style="color:#fbbf24; font-size:0.5rem;"></i> zero · <i class="fas fa-circle" style="color:#f87171; font-size:0.5rem;"></i> negative</span>
    </div>
</div>

<script>
    let currentQuestionsMeta = [];
    let currentMarks = [];
    let gridContainer = null;
    let timerDisabledFlag = false;
    let unfairFlags = [];
    let attemptedOverrides = [];

    function isAttempted(answerValue) {
        if (answerValue === null) return false;
        if (typeof answerValue === 'string' && answerValue.trim() === "R") return false;
        return true;
    }

    function parseAnswersToMeta(jsonObj) {
        if (!jsonObj || !jsonObj.answers || typeof jsonObj.totalQuestions !== 'number') {
            throw new Error('Invalid JSON: requires "totalQuestions" (number) and "answers" object');
        }
        const answersMap = jsonObj.answers;
        const totalQ = jsonObj.totalQuestions;
        const meta = [];
        for (let i = 1; i <= totalQ; i++) {
            const qKey = `Q${i}`;
            let rawAnswer = answersMap.hasOwnProperty(qKey) ? answersMap[qKey] : null;
            const attemptedFlag = isAttempted(rawAnswer);
            meta.push({
                id: qKey,
                answerRaw: rawAnswer,
                attempted: attemptedFlag,
            });
        }
        return meta;
    }

    function updateTimerBanner() {
        const bannerContainer = document.getElementById('timerBannerContainer');
        if (!bannerContainer) return;
        if (timerDisabledFlag === true) {
            bannerContainer.innerHTML = `
                <div class="timer-banner">
                    <i class="fas fa-info-circle"></i>
                    <span>INFO:</span>
                    <span>This test was taken with timer disabled</span>
                </div>
            `;
        } else {
            bannerContainer.innerHTML = '';
        }
    }

    function applyUnfairHighlightToCard(cardElement, isUnfair) {
        if (!cardElement) return;
        if (isUnfair) {
            cardElement.classList.add('unfair-highlight');
        } else {
            cardElement.classList.remove('unfair-highlight');
        }
    }

    function toggleUnfairFlag(questionIndex) {
        if (questionIndex < 0 || questionIndex >= unfairFlags.length) return;
        unfairFlags[questionIndex] = !unfairFlags[questionIndex];
        const card = document.querySelector(`.q-card[data-index="${questionIndex}"]`);
        if (card) {
            applyUnfairHighlightToCard(card, unfairFlags[questionIndex]);
        }
    }

    function toggleAttempted(questionIndex) {
        if (questionIndex < 0 || questionIndex >= currentQuestionsMeta.length) return;
        attemptedOverrides[questionIndex] = !attemptedOverrides[questionIndex];
        const card = document.querySelector(`.q-card[data-index="${questionIndex}"]`);
        if (card) {
            updateAttemptedDisplay(card, questionIndex);
        }
        updateStatsAndTotal();
    }

    function getAttemptedState(index) {
        if (attemptedOverrides[index] !== undefined) {
            return attemptedOverrides[index];
        }
        return currentQuestionsMeta[index].attempted;
    }

    function updateAttemptedDisplay(card, index) {
        const qNum = card.querySelector('.q-num');
        if (qNum) {
            const isAtt = getAttemptedState(index);
            qNum.classList.toggle('unattempted', !isAtt);
        }
    }

    function renderGrid() {
        if (!gridContainer) return;
        if (!currentQuestionsMeta.length) {
            gridContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No exam data loaded. Please upload a valid answers.json file.</p>
                    <span class="highlight-text" onclick="document.getElementById('answersFileInput').click()">
                        <i class="fas fa-upload" style="font-size:0.8rem;"></i> Load answers.json
                    </span>
                </div>
            `;
            return;
        }

        let html = '';
        for (let idx = 0; idx < currentQuestionsMeta.length; idx++) {
            const q = currentQuestionsMeta[idx];
            const markVal = currentMarks[idx];
            let markClass = '';
            if (markVal > 0) markClass = 'mark-positive';
            else if (markVal === 0) markClass = 'mark-zero';
            else markClass = 'mark-negative';

            const isAtt = getAttemptedState(idx);
            const qNumClass = isAtt ? '' : 'unattempted';
            
            let answerPreview = (q.answerRaw === null ? '∅' : (typeof q.answerRaw === 'string' ? q.answerRaw : String(q.answerRaw)));
            if (q.answerRaw === null) answerPreview = '∅';
            if (q.answerRaw === 'R') answerPreview = '"R"';
            if (answerPreview.length > 14) answerPreview = answerPreview.slice(0, 12) + '…';

            html += `
                <div class="q-card" data-index="${idx}" data-question-id="${q.id}">
                    <div class="q-header">
                        <span class="q-num ${qNumClass}"><i class="fas fa-hashtag" style="font-size:0.5rem; opacity:0.3; margin-right:2px;"></i>${q.id.replace('Q','')}</span>
                    </div>
                    <div class="q-body">
                        <div class="answer-preview"><i class="fas fa-answer" style="font-size:0.5rem; opacity:0.3; margin-right:4px;"></i>${escapeHtml(answerPreview)}</div>
                        <div class="mark-display ${markClass}" id="markChip-${idx}">
                            ${markVal > 0 ? `<i class="fas fa-plus" style="font-size:0.6rem; opacity:0.5;"></i> ${markVal}` : markVal}
                        </div>
                    </div>
                </div>
            `;
        }
        gridContainer.innerHTML = html;
        gridContainer.style.animation = 'none';
        requestAnimationFrame(() => {
            gridContainer.style.animation = 'fadeIn 0.5s ease';
        });

        const cards = gridContainer.querySelectorAll('.q-card');
        cards.forEach(card => {
            const idxAttr = card.getAttribute('data-index');
            if (idxAttr === null) return;
            const index = parseInt(idxAttr, 10);
            
            card.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                modifyMark(index, +1);
            });
            
            card.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                modifyMark(index, -1);
                return false;
            });

            card.addEventListener('auxclick', (e) => {
                if (e.button === 1) {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleUnfairFlag(index);
                    return false;
                }
            });
            
            card.addEventListener('keydown', (e) => {
                if (e.key === 'a' || e.key === 'A') {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleAttempted(index);
                }
            });

            card.addEventListener('mouseenter', () => {
                card.setAttribute('tabindex', '0');
                card.focus();
            });

            card.addEventListener('mouseleave', () => {
                card.blur();
            });

            if (unfairFlags[index]) {
                applyUnfairHighlightToCard(card, true);
            }
            updateAttemptedDisplay(card, index);
        });
        
        updateStatsAndTotal();
    }
    
    function modifyMark(questionIndex, delta) {
        if (questionIndex < 0 || questionIndex >= currentMarks.length) return;
        let newVal = currentMarks[questionIndex] + delta;
        currentMarks[questionIndex] = newVal;
        updateSingleMarkDisplay(questionIndex);
        updateStatsAndTotal();
    }
    
    function updateSingleMarkDisplay(idx) {
        const chip = document.getElementById(`markChip-${idx}`);
        if (!chip) return;
        const val = currentMarks[idx];
        chip.innerText = val > 0 ? `+${val}` : val;
        chip.classList.remove('mark-positive', 'mark-zero', 'mark-negative');
        if (val > 0) {
            chip.classList.add('mark-positive');
        } else if (val === 0) {
            chip.classList.add('mark-zero');
        } else {
            chip.classList.add('mark-negative');
        }
    }
    
    function updateStatsAndTotal() {
        if (!currentQuestionsMeta.length) {
            const attemptedSpan = document.getElementById('attemptedCount');
            const unattemptedSpan = document.getElementById('unattemptedCount');
            const totalQSpan = document.getElementById('totalQDisplay');
            const grandTotalSpan = document.getElementById('grandTotal');
            if (attemptedSpan) attemptedSpan.innerText = '0';
            if (unattemptedSpan) unattemptedSpan.innerText = '0';
            if (totalQSpan) totalQSpan.innerText = '0';
            if (grandTotalSpan) {
                grandTotalSpan.innerText = '0.00';
                grandTotalSpan.className = 'total-mark-number zero';
            }
            return;
        }
        
        let attemptedCount = 0;
        let unattemptedCount = 0;
        let totalMarks = 0;
        for (let i = 0; i < currentQuestionsMeta.length; i++) {
            const isAtt = getAttemptedState(i);
            if (isAtt) attemptedCount++;
            else unattemptedCount++;
            totalMarks += currentMarks[i];
        }
        
        const attemptedSpan = document.getElementById('attemptedCount');
        const unattemptedSpan = document.getElementById('unattemptedCount');
        const totalQSpan = document.getElementById('totalQDisplay');
        const grandTotalSpan = document.getElementById('grandTotal');
        
        if (attemptedSpan) {
            attemptedSpan.innerText = attemptedCount;
            attemptedSpan.classList.remove('pop');
            requestAnimationFrame(() => attemptedSpan.classList.add('pop'));
        }
        if (unattemptedSpan) {
            unattemptedSpan.innerText = unattemptedCount;
            unattemptedSpan.classList.remove('pop');
            requestAnimationFrame(() => unattemptedSpan.classList.add('pop'));
        }
        if (totalQSpan) {
            totalQSpan.innerText = currentQuestionsMeta.length;
            totalQSpan.classList.remove('pop');
            requestAnimationFrame(() => totalQSpan.classList.add('pop'));
        }
        if (grandTotalSpan) {
            grandTotalSpan.innerText = totalMarks.toFixed(1);
            grandTotalSpan.className = 'total-mark-number';
            if (totalMarks > 0) grandTotalSpan.classList.add('positive');
            else if (totalMarks === 0) grandTotalSpan.classList.add('zero');
            else grandTotalSpan.classList.add('negative');
        }
    }
    
    function resetAllMarks() {
        if (!currentQuestionsMeta.length) return;
        for (let i = 0; i < currentMarks.length; i++) {
            currentMarks[i] = 0;
        }
        for (let i = 0; i < currentMarks.length; i++) {
            updateSingleMarkDisplay(i);
        }
        updateStatsAndTotal();
        showToast('Marks reset to zero', 'info');
    }

    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(30,41,59,0.95); backdrop-filter: blur(20px);
            color: #f1f5f9; padding: 0.6rem 1.5rem; border-radius: 60px;
            font-size: 0.8rem; font-weight: 500; z-index: 999;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease;
        `;
        const icon = type === 'info' ? 'fa-info-circle' : 'fa-check-circle';
        toast.innerHTML = `<i class="fas ${icon}" style="margin-right:0.6rem; color:#60a5fa;"></i> ${message}`;
        document.body.appendChild(toast);
        requestAnimationFrame(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
        });
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
            setTimeout(() => toast.remove(), 400);
        }, 2000);
    }

    function loadExamData(jsonObject) {
        try {
            const meta = parseAnswersToMeta(jsonObject);
            if (!meta.length) {
                throw new Error('No questions generated from the JSON');
            }
            
            if (jsonObject.hasOwnProperty('timerDisabled') && jsonObject.timerDisabled === true) {
                timerDisabledFlag = true;
            } else {
                timerDisabledFlag = false;
            }
            
            currentQuestionsMeta = meta;
            currentMarks = new Array(meta.length).fill(0);
            unfairFlags = new Array(meta.length).fill(false);
            attemptedOverrides = new Array(meta.length).fill(undefined);
            updateTimerBanner();
            renderGrid();
            showToast(`Loaded ${meta.length} questions`, 'info');
        } catch (err) {
            console.error(err);
            if (gridContainer) {
                gridContainer.innerHTML = `
                    <div class="error-msg">
                        <i class="fas fa-exclamation-circle"></i>
                        Error loading file: ${escapeHtml(err.message)}
                    </div>
                `;
            }
            currentQuestionsMeta = [];
            currentMarks = [];
            unfairFlags = [];
            attemptedOverrides = [];
            timerDisabledFlag = false;
            updateTimerBanner();
        }
    }
    
    function handleFileUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const jsonContent = JSON.parse(e.target.result);
                loadExamData(jsonContent);
                const fileNameSpan = document.getElementById('fileNameDisplay');
                if (fileNameSpan) fileNameSpan.innerHTML = `<i class="fas fa-file" style="font-size:0.7rem; opacity:0.3;"></i> ${file.name}`;
            } catch (parseErr) {
                if (gridContainer) {
                    gridContainer.innerHTML = `
                        <div class="error-msg">
                            <i class="fas fa-exclamation-circle"></i>
                            Invalid JSON file: ${escapeHtml(parseErr.message)}
                        </div>
                    `;
                }
                currentQuestionsMeta = [];
                currentMarks = [];
                unfairFlags = [];
                attemptedOverrides = [];
                timerDisabledFlag = false;
                updateTimerBanner();
            }
        };
        reader.onerror = () => {
            if (gridContainer) {
                gridContainer.innerHTML = `
                    <div class="error-msg">
                        <i class="fas fa-exclamation-circle"></i>
                        Failed to read file.
                    </div>
                `;
            }
        };
        reader.readAsText(file);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        gridContainer = document.getElementById('dynamicGridContainer');
        const fileInput = document.getElementById('answersFileInput');
        const resetBtn = document.getElementById('resetAllMarksBtn');
        
        if (fileInput) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    handleFileUpload(file);
                }
            });
        }
        
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (currentQuestionsMeta.length) {
                    resetAllMarks();
                }
            });
        }
        
        currentQuestionsMeta = [];
        currentMarks = [];
        unfairFlags = [];
        attemptedOverrides = [];
        timerDisabledFlag = false;
        if (gridContainer) {
            gridContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No answers.json loaded.</p>
                    <span class="highlight-text" onclick="document.getElementById('answersFileInput').click()">
                        <i class="fas fa-upload" style="font-size:0.8rem;"></i> Upload a file
                    </span>
                </div>
            `;
        }
        updateTimerBanner();
        updateStatsAndTotal();
    });
    
    window.__loadExamJSON = loadExamData;
</script>
</body>
</html>
